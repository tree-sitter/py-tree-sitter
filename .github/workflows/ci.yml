name: CI

on:
  push:
    branches: [master]
    paths:
      - tree_sitter/**
      - tests/**
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - tree_sitter/**
      - tests/**
      - .github/workflows/ci.yml
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Lint
        continue-on-error: true
        run: pipx run ruff check . --output-format=github
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
          - windows-11-arm
    runs-on: ${{matrix.os}}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python ${{matrix.python}}
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python}}
      - name: Build extension
        run: pip install -v -e .[tests]
        env:
          CFLAGS: -Wextra -Og -g -fno-omit-frame-pointer
      - name: Run unit tests
        run: python -munittest -v
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Set up suppressions
        run: curl -OLSsf https://github.com/python/cpython/raw/3.15/Misc/valgrind-python.supp
      - name: Build extension
        run: pip install -v -e .[tests]
      - name: Run with valgrind
        run: |-
          valgrind --error-exitcode=1 --leak-check=full \
            --show-leak-kinds=definite --errors-for-leak-kinds=definite \
            --suppressions=valgrind-python.supp python -munittest -v
        env:
          PYTHONMALLOC: mimalloc
